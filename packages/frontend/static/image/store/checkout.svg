<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="440" viewBox="0 25 1300 440" fill="none" role="img" aria-labelledby="checkout-title checkout-description">
  <title id="checkout-title">Checkout</title>
  <desc id="checkout-description">Hand-drawn grayscale CHECKOUT graffiti: eight individual interlocking block letters with bent stems, flared terminals, carved ink ribbons, shaded 3D sides, spray dots, and loose paint strokes.</desc>
