<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="310" viewBox="0 0 1250 310" fill="none" role="img" aria-labelledby="checkout-title checkout-description">
  <title id="checkout-title">Checkout</title>
  <desc id="checkout-description">Arcade-style CHECKOUT: upright chamfered block capitals with a chrome face split by a dark horizon, standing on a deep isometric extrusion.</desc>
  <defs>
    <!-- Chrome: bright sky, a hard dark horizon, then ground lightening to the base. -->
    <linearGradient id="chrome" x1="0" y1="40" x2="0" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/><stop offset=".5" stop-color="#d4d4d4"/><stop offset=".5" stop-color="#4a4a4a"/><stop offset=".56" stop-color="#9c9c9c"/><stop offset="1" stop-color="#e8e8e8"/>
    </linearGradient>
    <!-- Each letter is drawn in its own 200-unit-tall cell from the top left; O cuts its counter with evenodd. -->
    <path id="c" d="M30 0 118 0 118 42 55 42 42 55 42 145 55 158 118 158 118 200 30 200 0 170 0 30Z"/>
    <path id="h" d="M0 0 42 0 42 79 82 79 82 0 124 0 124 200 82 200 82 121 42 121 42 200 0 200Z"/>
    <path id="e" d="M30 0 108 0 108 42 42 42 42 79 92 79 92 121 42 121 42 158 108 158 108 200 30 200 0 170 0 30Z"/>
    <path id="k" d="M0 0 42 0 42 76.9 70 0 126 0 76.7 100 126 200 70 200 42 123.1 42 200 0 200Z"/>
    <path id="o" fill-rule="evenodd" d="M30 0 98 0 128 30 128 170 98 200 30 200 0 170 0 30Z M55 42 73 42 86 55 86 145 73 158 55 158 42 145 42 55Z"/>
    <path id="u" d="M0 0 42 0 42 145 55 158 69 158 82 145 82 0 124 0 124 170 94 200 30 200 0 170Z"/>
    <path id="t" d="M0 0 124 0 124 42 83 42 83 200 41 200 41 42 0 42Z"/>
    <g id="word">
      <use href="#c" x="46" y="40"/>
      <use href="#h" x="186" y="40"/>
      <use href="#e" x="332" y="40"/>
      <use href="#c" x="462" y="40"/>
      <use href="#k" x="602" y="40"/>
      <use href="#o" x="750" y="40"/>
      <use href="#u" x="900" y="40"/>
      <use href="#t" x="1046" y="40"/>
    </g>
  </defs>
  <!-- The extrusion steps back to (34 34), outlined at its deepest. -->
  <use href="#word" transform="translate(34 34)" fill="#3c3c3c" stroke="#0a0a0a" stroke-width="9" stroke-linejoin="round"/>
  <g fill="#3c3c3c">
    <use href="#word" transform="translate(34 34)"/>
    <use href="#word" transform="translate(31.17 31.17)"/>
    <use href="#word" transform="translate(28.33 28.33)"/>
    <use href="#word" transform="translate(25.5 25.5)"/>
    <use href="#word" transform="translate(22.67 22.67)"/>
    <use href="#word" transform="translate(19.83 19.83)"/>
    <use href="#word" transform="translate(17 17)"/>
    <use href="#word" transform="translate(14.17 14.17)"/>
    <use href="#word" transform="translate(11.33 11.33)"/>
    <use href="#word" transform="translate(8.5 8.5)"/>
    <use href="#word" transform="translate(5.67 5.67)"/>
    <use href="#word" transform="translate(2.83 2.83)"/>
  </g>
  <!-- A dark rim, then the chrome faces. -->
  <use href="#word" fill="#080808" stroke="#080808" stroke-width="9" stroke-linejoin="round"/>
  <use href="#word" fill="url(#chrome)"/>
</svg>
