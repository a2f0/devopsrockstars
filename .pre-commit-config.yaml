repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.1.0
  hooks:
    - id: check-yaml
      exclude: pnpm-lock\.yaml
    - id: end-of-file-fixer
    - id: trailing-whitespace
    - id: check-merge-conflict
    - id: forbid-new-submodules
    - id: mixed-line-ending
    - id: no-commit-to-branch
      args: ['--branch', 'production']
- repo: local
  hooks:
    - id: check-for-unpinned-dependencies
      name: check-for-unpinned-dependencies
      entry: pnpm exec check-for-unpinned-dependencies
      pass_filenames: false
      language: node
    - id: biome format
      name: biome format
      entry: pnpm exec biome format
      pass_filenames: false
      language: node
    - id: biome lint
      name: biome lint
      entry: pnpm exec biome lint
      pass_filenames: false
      language: node
    - id: audit
      name: pnpm audit
      entry: pnpm audit --audit-level=critical --prod
      pass_filenames: false
      language: node
    - id: tsc
      name: tsc
      entry: pnpm exec tsc -b
      pass_filenames: false
      language: node
