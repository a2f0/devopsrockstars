# Packages referenced outside of import statements (webpack loader strings,
# CLI bins, NODE_OPTIONS loaders, pre-commit hooks) that depcheck cannot see.
ignores:
  - '@svgr/webpack'
  - '@types/leaflet'
  - '@types/mocha'
  - '@types/node'
  - '@types/react'
  - '@types/react-dom'
  - '@wdio/cli'
  - '@wdio/dot-reporter'
  - '@wdio/local-runner'
  - '@wdio/spec-reporter'
  - 'copy-webpack-plugin'
  - 'depcheck'
  - 'html-webpack-plugin'
  - 'knip'
  - 'markdownlint-cli2'
  - 'ts-loader'
  - 'tsx'
  - 'url-loader'
  - 'webpack'
  - 'webpack-cli'
  - 'webpack-dev-server'
  - 'wrangler'
