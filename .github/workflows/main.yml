name: Github Actions

on:
  push:
    branches: '**'
  pull_request:
    branches: '**'
  workflow_dispatch:
    inputs:
      operation:
        description: Validate and preview, or explicitly deploy staging
        type: choice
        default: preview
        options:
          - preview
          - deploy-staging

jobs:
  code-quality:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          install_args: bun
      - name: bun audit
        run: bun audit --audit-level=critical --prod
      - name: bun install
        run: bun install --frozen-lockfile
      - name: Validate the actual branch name
        if: github.event_name == 'pull_request' || github.ref_type == 'branch'
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: bun run lint:branch-name "$BRANCH_NAME"
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.15'
          architecture: 'x64'
      - name: pre-commit
        run: |
          pip install pre-commit==4.7.0
          pre-commit install
          pre-commit run --all-files
        env:
          SKIP: no-commit-to-branch
      - name: Unit tests
        run: bun run unit
      - run: bun run ci-headless
      - name: Upload browser test failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-failures
          path: ${{ runner.temp }}/browser-failures/
          if-no-files-found: ignore
          retention-days: 7

  preview:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'preview'
    needs: code-quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [staging, prod]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          install_args: bun
      - run: bun install --frozen-lockfile
      - name: Preview both Workers and existing live resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_ENVIRONMENT: ${{ matrix.environment }}
        run: bun scripts/deploy/deploy.ts "$PREVIEW_ENVIRONMENT" --dry-run

  deploy-staging:
    concurrency:
      group: cloudflare-staging
      cancel-in-progress: false
    runs-on: ubuntu-latest
    needs: code-quality
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-staging') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/staging')
    continue-on-error: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          install_args: bun
      - name: bun install
        run: bun install --frozen-lockfile
      - name: Deploy staging to Cloudflare
        run: bun run deploy:staging

  deploy-production:
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    needs: code-quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          install_args: bun
      - name: bun install
        run: bun install --frozen-lockfile
      - name: Deploy production to Cloudflare
        run: bun run deploy:prod
