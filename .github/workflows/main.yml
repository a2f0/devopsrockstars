name: Github Actions

on:
  push:
    branches: '**'
  pull_request:
    branches: '**'

jobs:
  code-quality:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: npm audit
        run: npm audit --audit-level=critical --production
      - name: npm ci
        run: npm ci
      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.13'
          architecture: 'x64'
      - name: pre-commit
        run: |
          pip install pre-commit
          pre-commit install
          pre-commit run --all-files
        env:
          SKIP: no-commit-to-branch
      - run: npm run ci-headless

  deploy:
    runs-on: ubuntu-latest
    needs: code-quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    continue-on-error: false
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: npm ci
        run: npm ci
      - name: Build
        run: npm run build
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1
      - name: deploy to s3
        run: |
          # First sync all assets (excluding index.html)
          aws s3 sync --acl=public-read ./build s3://devopsrockstars.com --exclude "index.html"
          # Then copy index.html separately
          aws s3 cp --acl=public-read ./build/index.html s3://devopsrockstars.com/index.html
          # Finally cleanup old files
          aws s3 sync --acl=public-read --delete ./build s3://devopsrockstars.com
