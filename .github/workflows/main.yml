name: Github Actions

on:
  push:
    branches: '**'
  pull_request:
    branches: '**'
  workflow_dispatch:

jobs:
  code-quality:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: latest
      - name: pnpm audit
        run: pnpm audit --audit-level=critical --prod
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          architecture: 'x64'
      - name: pre-commit
        run: |
          pip install pre-commit
          pre-commit install
          pre-commit run --all-files
        env:
          SKIP: no-commit-to-branch
      - name: Unit tests
        run: pnpm unit
      - run: pnpm run ci-headless
      - name: Upload hat preview failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hat-preview-failures
          path: ${{ runner.temp }}/hat-preview-failures/
          if-no-files-found: ignore
          retention-days: 7

  deploy-staging:
    runs-on: ubuntu-latest
    needs: code-quality
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/staging')
    continue-on-error: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: latest
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Deploy staging to Cloudflare
        run: pnpm run deploy:staging

  deploy-production:
    runs-on: ubuntu-latest
    needs: code-quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    continue-on-error: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: latest
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Deploy production to Cloudflare
        run: pnpm run deploy:prod
